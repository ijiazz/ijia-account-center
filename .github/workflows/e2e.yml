name: E2E Test
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build images
        run: docker compose build account-center-be

      - name: Export image
        run: docker save -o account-center-be.tar ijia/account-center-be

      - uses: actions/upload-artifact@v7
        with:
          name: account-center-be-image
          path: account-center-be.tar
          overwrite: true

  e2e:
    runs-on: ubuntu-22.04
    needs: build-images
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2
          cache: true

      - name: Install dependencies
        run: |
          deno install --frozen
          cd ../fe && deno install --frozen
        working-directory: ./e2e
      - name: Build Web
        run: deno task build
        working-directory: ./fe

      - uses: actions/download-artifact@v4
        with:
          name: account-center-be-image
      - name: Load account-center-be image
        run: docker load -i account-center-be.tar
      - name: Build remaining local services
        run: docker compose build ijiadb redis
      - name: Start services
        run: docker compose up -d

      - uses: actions/cache@v4 #https://playwright.dev/docs/browsers#managing-browser-binaries
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-browser-${{ hashFiles('e2e/deno.json') }}
      - name: Install browser
        run: deno task ci:install-browser
        working-directory: ./e2e
      - name: Run web server
        run: nohup deno task preview > /dev/null 2>&1 &
        working-directory: ./fe

      - name: E2E test
        run: deno task e2e:run
        env:
          DATABASE_URL: "postgresql://postgres@localhost:5442/ijia"
          WEB_URL: "http://localhost:4173"
          API_ORIGIN: "http://localhost:9003"
        working-directory: ./e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
